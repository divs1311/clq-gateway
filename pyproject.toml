[project]
name = "clq-gateway"
version = "0.1.0"
description = "Cost-latency-quality routing gateway and eval harness for a merchant support copilot"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11", "scikit-learn>=1.4", "pydantic>=2.5", "pyyaml>=6"]

[project.optional-dependencies]
live = ["litellm>=1.40"]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["clq"]

[tool.pytest.ini_options]
testpaths = ["tests"]
